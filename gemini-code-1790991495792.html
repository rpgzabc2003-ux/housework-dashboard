<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>家庭家務追蹤 Dashboard</title>
  <style>
    :root {
      --primary: #6366F1;
      --primary-dark: #4F46E5;
      --primary-light: #EEF2FF;
      --bg-main: #F8FAFC;
      --card-bg: #FFFFFF;
      --text-main: #0F172A;
      --text-muted: #64748B;
      --border: #E2E8F0;
      --success: #10B981;
      --warning: #F59E0B;
      --warning-light: #FFFBEB;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
      --radius: 16px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg-main); color: var(--text-main); padding: 20px 16px; max-width: 800px; margin: 0 auto; line-height: 1.5; }

    header {
      background: linear-gradient(135deg, #6366F1 0%, #4F46E5 100%);
      color: white; padding: 24px 20px; border-radius: var(--radius);
      box-shadow: 0 10px 15px -3px rgba(79, 70, 229, 0.3); margin-bottom: 20px;
      display: flex; justify-content: space-between; align-items: center;
    }
    header h1 { font-size: 1.4rem; font-weight: 800; letter-spacing: -0.5px; outline: none; padding: 2px 4px; border-radius: 6px; }
    header h1:hover { background: rgba(255,255,255,0.15); }
    header .header-sub { font-size:0.8rem; opacity:0.85; margin-top:2px; outline:none; padding:2px 4px; border-radius:4px; }
    header .header-sub:hover { background: rgba(255,255,255,0.15); }
    header .date-badge { background: rgba(255,255,255,0.2); padding: 6px 12px; border-radius: 20px; font-size: 0.85rem; font-weight: 500; display:flex; align-items:center; gap:6px; }

    .sync-status { width: 8px; height: 8px; border-radius: 50%; background: #10B981; display: inline-block; }
    .sync-status.offline { background: #EF4444; }

    .tabs { display: flex; gap: 10px; margin-bottom: 20px; background: #E2E8F0; padding: 4px; border-radius: 12px; }
    .tab-btn { flex: 1; padding: 12px; border: none; background: transparent; font-weight: 700; color: var(--text-muted); border-radius: 8px; cursor: pointer; transition: all 0.2s; text-align: center; font-size: 0.95rem; }
    .tab-btn.active { background: white; color: var(--primary-dark); box-shadow: var(--shadow); }

    .card { background: var(--card-bg); border-radius: var(--radius); padding: 20px; margin-bottom: 20px; box-shadow: var(--shadow); border: 1px solid var(--border); }
    .card-title { font-size: 1.1rem; font-weight: 700; margin-bottom: 16px; display: flex; align-items: center; justify-content: space-between; color: var(--text-main); }

    .form-group { margin-bottom: 16px; }
    label { display: block; font-size: 0.85rem; font-weight: 700; color: var(--text-muted); margin-bottom: 6px; text-transform: uppercase; }
    input[type="text"], input[type="date"], input[type="number"], select {
      width: 100%; padding: 12px 14px; border: 1.5px solid var(--border); border-radius: 10px; font-size: 0.95rem; outline: none; background: #F8FAFC;
    }
    input[type="text"]:focus, input[type="date"]:focus, select:focus { border-color: var(--primary); background: white; }

    .tag-container { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; align-items: center; }
    .chip { background: var(--primary-light); color: var(--primary-dark); padding: 5px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: 600; cursor: pointer; }
    .chip-manage { background: #F1F5F9; color: var(--text-muted); font-size: 0.75rem; padding: 4px 10px; border-radius: 16px; cursor: pointer; border: 1px dashed var(--border); }

    .btn-submit { width: 100%; padding: 14px; border: none; background: linear-gradient(135deg, #6366F1 0%, #4F46E5 100%); color: white; font-weight: 700; font-size: 1rem; border-radius: 10px; cursor: pointer; box-shadow: 0 4px 12px rgba(79, 70, 229, 0.25); }

    .progress-bar-bg { background: #E2E8F0; height: 8px; border-radius: 4px; overflow: hidden; margin-bottom: 16px; }
    .progress-bar-fill { background: var(--success); height: 100%; width: 0%; transition: width 0.3s ease; }

    .chore-item { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; background: white; border: 1.5px solid var(--border); border-radius: 12px; margin-bottom: 10px; gap: 12px; }
    .chore-item.completed { background: #F8FAFC; opacity: 0.7; border-color: transparent; }
    .chore-item.completed .chore-title { text-decoration: line-through; color: var(--text-muted); }

    .chore-content { flex: 1; display: flex; flex-direction: column; gap: 4px; }
    .chore-title { font-weight: 700; font-size: 1rem; }
    .chore-tags { display: flex; gap: 6px; flex-wrap: wrap; }
    
    .badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 6px; font-size: 0.75rem; font-weight: 600; }
    .badge-executor { background: #E0E7FF; color: #3730A3; }
    .badge-recurring { background: var(--warning-light); color: #B45309; border: 1px solid #FDE68A; }

    .action-group { display: flex; gap: 6px; align-items: center; }
    .icon-btn { border: none; background: #F1F5F9; padding: 8px 12px; border-radius: 8px; font-size: 0.85rem; font-weight: 600; cursor: pointer; color: var(--text-muted); }
    .btn-forward { background: var(--warning-light); color: var(--warning); border: 1px solid #FDE68A; }

    .cal-header-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; text-align: center; }
    .cal-weekday { font-weight: 700; font-size: 0.8rem; color: var(--text-muted); padding: 8px 0; }
    .cal-day { min-height: 65px; border: 1px solid var(--border); border-radius: 10px; padding: 6px; background: white; cursor: pointer; display: flex; flex-direction: column; justify-content: space-between; }
    .cal-day.today { border: 2px solid var(--primary); font-weight: bold; background: var(--primary-light); }
    .cal-day-num { font-size: 0.85rem; font-weight: 700; }
    .cal-status { font-size: 0.7rem; color: var(--primary-dark); font-weight: 700; background: #EEF2FF; padding: 2px 4px; border-radius: 4px; }

    .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.5); backdrop-filter: blur(4px); justify-content: center; align-items: center; z-index: 100; padding: 16px; }
    .modal-overlay.open { display: flex; }
    .modal-box { background: white; padding: 24px; border-radius: var(--radius); width: 100%; max-width: 440px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1); max-height: 90vh; overflow-y: auto; }

    .manage-item { display: flex; align-items: center; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--border); gap: 8px; }
    .manage-item input { padding: 6px 10px; font-size: 0.9rem; }
  </style>
</head>
<body>

  <header>
    <div>
      <h1 contenteditable="true" id="header-main-title" onblur="saveHeaderTitle()">🏡 家務追蹤 Dashboard</h1>
      <div class="header-sub" contenteditable="true" id="header-sub-title" onblur="saveHeaderTitle()">家庭協作與生活管理 (雲端同步中 - 點擊標題可修改)</div>
    </div>
    <div class="date-badge">
      <span class="sync-status" id="sync-dot" title="雲端連線狀態"></span>
      <span id="header-today-date">--</span>
    </div>
  </header>

  <div class="tabs">
    <button class="tab-btn active" onclick="switchView('list')">📋 家務清單</button>
    <button class="tab-btn" onclick="switchView('calendar')">🗓️️ 月曆視圖</button>
  </div>

  <div id="view-list">
    <div class="card">
      <div class="card-title">✨ 新增家務事項</div>

      <div class="form-group">
        <label>家務名稱</label>
        <input type="text" id="input-title" placeholder="例如：洗碗、換床單、拖地" list="list-titles">
        <datalist id="list-titles"></datalist>
        <div class="tag-container" id="chips-titles"></div>
      </div>

      <div class="form-group">
        <label>負責人（執行者）</label>
        <input type="text" id="input-executor" placeholder="例如：爸爸、媽媽、仔仔" list="list-executors">
        <datalist id="list-executors"></datalist>
        <div class="tag-container" id="chips-executors"></div>
      </div>

      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
        <div class="form-group">
          <label>起始 / 執行日期</label>
          <input type="date" id="input-date">
        </div>
        <div class="form-group">
          <label>重複週期</label>
          <select id="input-repeat-type" onchange="toggleIntervalInput()">
            <option value="none">單次事項（不重複）</option>
            <option value="daily">🔄 每日固定</option>
            <option value="interval">⏳ 每隔 N 日一次</option>
          </select>
        </div>
      </div>

      <div class="form-group" id="group-interval" style="display:none;">
        <label>隔幾多日一次？</label>
        <div style="display:flex; align-items:center; gap:8px;">
          <input type="number" id="input-interval-days" min="2" value="3" style="width:100px;">
          <span style="font-size:0.9rem; font-weight:600; color:var(--text-muted);">天一次 (例如: 每3天拖一次地)</span>
        </div>
      </div>

      <button class="btn-submit" onclick="addChore()">＋ 新增家務</button>
    </div>

    <!-- Bring Forward 區塊 -->
    <div class="card" id="section-overdue" style="display:none; border-left: 5px solid var(--warning);">
      <div class="card-title" style="color: var(--warning);">⚠️️ 之前的未完成家務 (Bring Forward)</div>
      <div id="container-overdue"></div>
    </div>

    <div class="card">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 12px;">
        <div class="card-title" id="list-date-title" style="margin-bottom:0;">今日家務</div>
        <span id="progress-text" style="font-size:0.85rem; font-weight:700; color:var(--text-muted);">0% 已完成</span>
      </div>
      <div class="progress-bar-bg"><div class="progress-bar-fill" id="progress-fill"></div></div>

      <div id="container-chores"></div>
    </div>
  </div>

  <div id="view-calendar" style="display:none;">
    <div class="card">
      <div class="cal-header-nav">
        <button class="icon-btn" onclick="changeMonth(-1)">◀ 上個月</button>
        <div style="font-weight:800; font-size:1.1rem;" id="cal-month-title">--</div>
        <button class="icon-btn" onclick="changeMonth(1)">下個月 ▶</button>
      </div>
      <div class="calendar-grid" id="calendar-grid"></div>
    </div>
  </div>

  <!-- 編輯 Modal -->
  <div class="modal-overlay" id="modal-edit">
    <div class="modal-box">
      <div class="card-title">✏️ 編輯家務細節</div>
      <input type="hidden" id="edit-id">
      <div class="form-group">
        <label>家務名稱</label>
        <input type="text" id="edit-title">
      </div>
      <div class="form-group">
        <label>負責人</label>
        <input type="text" id="edit-executor">
      </div>
      <div class="form-group">
        <label>起始 / 執行日期</label>
        <input type="date" id="edit-date">
      </div>
      <div class="form-group">
        <label>重複週期</label>
        <select id="edit-repeat-type" onchange="toggleEditIntervalInput()">
          <option value="none">單次事項（不重複）</option>
          <option value="daily">🔄 每日固定</option>
          <option value="interval">⏳ 每隔 N 日一次</option>
        </select>
      </div>
      <div class="form-group" id="edit-group-interval" style="display:none;">
        <label>隔幾多日一次？</label>
        <input type="number" id="edit-interval-days" min="2" value="3">
      </div>
      <div style="display:flex; gap:10px; margin-top:20px;">
        <button class="btn-submit" onclick="saveEdit()" style="flex:1;">儲存修改</button>
        <button class="icon-btn" onclick="closeModal('modal-edit')" style="flex:1;">取消</button>
      </div>
    </div>
  </div>

  <!-- 管理選單 Modal -->
  <div class="modal-overlay" id="modal-manage-history">
    <div class="modal-box">
      <div class="card-title">⚙ 管理選單選項</div>
      <div style="font-size:0.85rem; color:var(--text-muted); margin-bottom:12px;">您可以新增、修改或刪除常用項目：</div>
      
      <h4 style="font-size:0.9rem; margin:12px 0 6px;">📋 常用家務名稱</h4>
      <div id="manage-titles-list"></div>
      <button class="icon-btn" onclick="addManageItem('title')" style="margin-top:6px; width:100%;">＋ 新增常用家務</button>

      <h4 style="font-size:0.9rem; margin:16px 0 6px;">👤 常用負責人</h4>
      <div id="manage-executors-list"></div>
      <button class="icon-btn" onclick="addManageItem('executor')" style="margin-top:6px; width:100%;">＋ 新增負責人</button>

      <div style="display:flex; gap:10px; margin-top:20px;">
        <button class="btn-submit" onclick="saveHistoryEdits()" style="flex:1;">儲存修改</button>
        <button class="icon-btn" onclick="closeModal('modal-manage-history')" style="flex:1;">取消</button>
      </div>
    </div>
  </div>

  <!-- Firebase SDK (v10) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getFirestore, collection, onSnapshot, doc, setDoc, updateDoc, deleteDoc 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // 你的 Firebase 設定
    const firebaseConfig = {
      apiKey: "AIzaSyAdc9V2TQ2-3GZJxclUjo_T-Xf-LF-BYes",
      authDomain: "kidney-f1e3c.firebaseapp.com",
      projectId: "kidney-f1e3c",
      storageBucket: "kidney-f1e3c.firebasestorage.app",
      messagingSenderId: "173809478708",
      appId: "1:173809478708:web:53fba267cbc78381abee61",
      measurementId: "G-HZTC93X4ML"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    window.historyTitles = ["洗碗", "拖地", "換床單", "倒垃圾", "摺衫"];
    window.historyExecutors = ["爸爸", "媽媽", "仔仔", "姐姐"];
    window.chores = [];
    window.recurringCompletions = {};

    const todayStr = new Date().toISOString().split('T')[0];
    window.selectedDate = todayStr;
    window.currentCalDate = new Date();

    document.getElementById('header-today-date').innerText = todayStr;
    document.getElementById('input-date').value = todayStr;

    // 即時監聽 Firestore
    onSnapshot(collection(db, "chores"), (snapshot) => {
      window.chores = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
      document.getElementById('sync-dot').classList.remove('offline');
      renderChores();
      renderCalendar();
    }, (err) => {
      console.error(err);
      document.getElementById('sync-dot').classList.add('offline');
    });

    onSnapshot(collection(db, "recurring_done"), (snapshot) => {
      window.recurringCompletions = {};
      snapshot.docs.forEach(doc => {
        window.recurringCompletions[doc.id] = doc.data().completedIds || [];
      });
      renderChores();
    });

    onSnapshot(doc(db, "settings", "general"), (docSnap) => {
      if (docSnap.exists()) {
        const data = docSnap.data();
        if (data.historyTitles) window.historyTitles = data.historyTitles;
        if (data.historyExecutors) window.historyExecutors = data.historyExecutors;
        if (data.headerMain) document.getElementById('header-main-title').innerText = data.headerMain;
        if (data.headerSub) document.getElementById('header-sub-title').innerText = data.headerSub;
        renderChips();
      } else {
        setDoc(doc(db, "settings", "general"), {
          historyTitles: window.historyTitles,
          historyExecutors: window.historyExecutors,
          headerMain: "🏡 家務追蹤 Dashboard",
          headerSub: "家庭協作與生活管理 (雲端同步中 - 點擊標題可修改)"
        });
      }
    });

    // 數據修改方法
    window.saveHeaderTitle = function() {
      const main = document.getElementById('header-main-title').innerText.trim();
      const sub = document.getElementById('header-sub-title').innerText.trim();
      updateDoc(doc(db, "settings", "general"), {
        headerMain: main,
        headerSub: sub
      }).catch(() => {});
    };

    window.addChore = async function() {
      const title = document.getElementById('input-title').value.trim();
      const executor = document.getElementById('input-executor').value.trim() || '未指派';
      const date = document.getElementById('input-date').value || todayStr;
      const repeatType = document.getElementById('input-repeat-type').value;
      const intervalDays = parseInt(document.getElementById('input-interval-days').value) || 2;

      if (!title) return alert('請輸入家務名稱！');

      const id = 'c_' + Date.now();
      await setDoc(doc(db, "chores", id), {
        title, executor, date, completed: false, repeatType, intervalDays
      });

      let updatedTitles = [...window.historyTitles];
      let updatedExecutors = [...window.historyExecutors];
      if (!updatedTitles.includes(title)) updatedTitles.unshift(title);
      if (executor !== '未指派' && !updatedExecutors.includes(executor)) updatedExecutors.unshift(executor);

      updateDoc(doc(db, "settings", "general"), {
        historyTitles: updatedTitles,
        historyExecutors: updatedExecutors
      });

      document.getElementById('input-title').value = '';
      document.getElementById('input-repeat-type').value = 'none';
      toggleIntervalInput();
    };

    window.toggleDone = async function(id, isRecurringLogic) {
      if (isRecurringLogic) {
        const curDone = window.recurringCompletions[window.selectedDate] || [];
        const newDone = curDone.includes(id) 
          ? curDone.filter(item => item !== id)
          : [...curDone, id];

        await setDoc(doc(db, "recurring_done", window.selectedDate), { completedIds: newDone });
      } else {
        const item = window.chores.find(c => c.id === id);
        if (item) {
          await updateDoc(doc(db, "chores", id), { completed: !item.completed });
        }
      }
    };

    window.bringForward = async function(id) {
      await updateDoc(doc(db, "chores", id), { date: todayStr });
    };

    window.deleteChore = async function(id) {
      await deleteDoc(doc(db, "chores", id));
    };

    window.saveEdit = async function() {
      const id = document.getElementById('edit-id').value;
      await updateDoc(doc(db, "chores", id), {
        title: document.getElementById('edit-title').value,
        executor: document.getElementById('edit-executor').value,
        date: document.getElementById('edit-date').value,
        repeatType: document.getElementById('edit-repeat-type').value,
        intervalDays: parseInt(document.getElementById('edit-interval-days').value) || 2
      });
      closeModal('modal-edit');
    };

    window.saveHistoryEdits = async function() {
      const titleInputs = document.querySelectorAll('#manage-titles-list input');
      const execInputs = document.querySelectorAll('#manage-executors-list input');

      const newTitles = Array.from(titleInputs).map(i => i.value.trim()).filter(Boolean);
      const newExecutors = Array.from(execInputs).map(i => i.value.trim()).filter(Boolean);

      window.historyTitles = newTitles;
      window.historyExecutors = newExecutors;

      await updateDoc(doc(db, "settings", "general"), {
        historyTitles: newTitles,
        historyExecutors: newExecutors
      });
      renderChips();
      closeModal('modal-manage-history');
    };
  </script>

  <!-- 介面邏輯 -->
  <script>
    function toggleIntervalInput() {
      const type = document.getElementById('input-repeat-type').value;
      document.getElementById('group-interval').style.display = type === 'interval' ? 'block' : 'none';
    }

    function toggleEditIntervalInput() {
      const type = document.getElementById('edit-repeat-type').value;
      document.getElementById('edit-group-interval').style.display = type === 'interval' ? 'block' : 'none';
    }

    function renderChips() {
      const cTitles = document.getElementById('chips-titles');
      const cExecutors = document.getElementById('chips-executors');

      cTitles.innerHTML = window.historyTitles.slice(0, 6).map(t => `<span class="chip" onclick="fillInput('input-title', '${t}')">${t}</span>`).join('') +
        `<span class="chip-manage" onclick="openManageHistoryModal()">⚙ 管理選項</span>`;

      cExecutors.innerHTML = window.historyExecutors.slice(0, 6).map(e => `<span class="chip" onclick="fillInput('input-executor', '${e}')">${e}</span>`).join('') +
        `<span class="chip-manage" onclick="openManageHistoryModal()">⚙️ 管理負責人</span>`;

      document.getElementById('list-titles').innerHTML = window.historyTitles.map(t => `<option value="${t}">`).join('');
      document.getElementById('list-executors').innerHTML = window.historyExecutors.map(e => `<option value="${e}">`).join('');
    }

    function fillInput(id, val) { document.getElementById(id).value = val; }

    function isChoreDueOnDate(chore, targetDateStr) {
      if (targetDateStr < chore.date) return false;
      if (chore.repeatType === 'none' || !chore.repeatType) return chore.date === targetDateStr;
      if (chore.repeatType === 'daily' || chore.isRecurring) return true;
      if (chore.repeatType === 'interval') {
        const startDate = new Date(chore.date);
        const targetDate = new Date(targetDateStr);
        const diffDays = Math.round((targetDate - startDate) / (1000 * 60 * 60 * 24));
        const interval = parseInt(chore.intervalDays || 1);
        return diffDays % interval === 0;
      }
      return false;
    }

    function renderChores() {
      const todayStr = new Date().toISOString().split('T')[0];
      window.selectedDate = document.getElementById('input-date').value || todayStr;
      document.getElementById('list-date-title').innerText = window.selectedDate === todayStr ? '今日家務清單' : `${window.selectedDate} 家務清單`;

      const overdueSection = document.getElementById('section-overdue');
      const overdueContainer = document.getElementById('container-overdue');
      const choresContainer = document.getElementById('container-chores');

      const overdueList = window.chores.filter(c => (!c.repeatType || c.repeatType === 'none') && c.date < todayStr && !c.completed);
      if (overdueList.length > 0 && window.selectedDate === todayStr) {
        overdueSection.style.display = 'block';
        overdueContainer.innerHTML = overdueList.map(c => `
          <div class="chore-item">
            <div class="chore-content">
              <span class="chore-title">${c.title}</span>
              <div style="font-size:0.8rem; color:var(--text-muted);">原定：${c.date} | 👤 ${c.executor}</div>
            </div>
            <button class="icon-btn btn-forward" onclick="bringForward('${c.id}')">帶到今天 ▶</button>
          </div>
        `).join('');
      } else {
        overdueSection.style.display = 'none';
      }

      const dayChores = window.chores.filter(c => isChoreDueOnDate(c, window.selectedDate));

      if (dayChores.length === 0) {
        choresContainer.innerHTML = `<div style="text-align:center; padding:30px; color:var(--text-muted); font-weight:600;">🎉 當日暫無家務，好好休息下吧！</div>`;
        updateProgress(0, 0);
        return;
      }

      const doneRecurringToday = window.recurringCompletions[window.selectedDate] || [];

      let doneCount = 0;
      choresContainer.innerHTML = dayChores.map(c => {
        const isRecurringLogic = c.repeatType === 'daily' || c.repeatType === 'interval' || c.isRecurring;
        const isDone = isRecurringLogic ? doneRecurringToday.includes(c.id) : c.completed;
        if (isDone) doneCount++;

        let badgeText = '';
        if (c.repeatType === 'daily' || c.isRecurring) badgeText = '🔄 每日固定';
        else if (c.repeatType === 'interval') badgeText = `⏳ 每 ${c.intervalDays} 日一次`;

        return `
          <div class="chore-item ${isDone ? 'completed' : ''}">
            <input type="checkbox" ${isDone ? 'checked' : ''} onchange="toggleDone('${c.id}', ${isRecurringLogic})" style="width:20px; height:20px; accent-color:var(--primary); cursor:pointer;">
            <div class="chore-content">
              <span class="chore-title">${c.title}</span>
              <div class="chore-tags">
                <span class="badge badge-executor">👤 ${c.executor}</span>
                ${badgeText ? `<span class="badge badge-recurring">${badgeText}</span>` : ''}
              </div>
            </div>
            <div class="action-group">
              <button class="icon-btn" onclick="openEditModal('${c.id}')">✏️</button>
              <button class="icon-btn" onclick="deleteChore('${c.id}')" style="color:#EF4444;">🗑️</button>
            </div>
          </div>
        `;
      }).join('');

      updateProgress(doneCount, dayChores.length);
    }

    function updateProgress(done, total) {
      const pct = total === 0 ? 0 : Math.round((done / total) * 100);
      document.getElementById('progress-text').innerText = `${pct}% 已完成 (${done}/${total})`;
      document.getElementById('progress-fill').style.width = `${pct}%`;
    }

    function changeMonth(offset) {
      window.currentCalDate.setMonth(window.currentCalDate.getMonth() + offset);
      renderCalendar();
    }

    function renderCalendar() {
      const grid = document.getElementById('calendar-grid');
      const year = window.currentCalDate.getFullYear();
      const month = window.currentCalDate.getMonth();
      const todayStr = new Date().toISOString().split('T')[0];

      document.getElementById('cal-month-title').innerText = `${year}年 ${month + 1}月`;

      const firstDay = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();

      let html = ['日','一','二','三','四','五','六'].map(d => `<div class="cal-weekday">${d}</div>`).join('');

      for (let i = 0; i < firstDay; i++) html += `<div></div>`;

      for (let d = 1; d <= daysInMonth; d++) {
        const dStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
        const count = window.chores.filter(c => isChoreDueOnDate(c, dStr)).length;

        html += `
          <div class="cal-day ${dStr === todayStr ? 'today' : ''}" onclick="selectCalDate('${dStr}')">
            <span class="cal-day-num">${d}</span>
            ${count > 0 ? `<span class="cal-status">${count} 項</span>` : ''}
          </div>
        `;
      }
      grid.innerHTML = html;
    }

    function selectCalDate(dStr) {
      document.getElementById('input-date').value = dStr;
      switchView('list');
      renderChores();
    }

    function switchView(view) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      if (view === 'list') {
        document.querySelectorAll('.tab-btn')[0].classList.add('active');
        document.getElementById('view-list').style.display = 'block';
        document.getElementById('view-calendar').style.display = 'none';
      } else {
        document.querySelectorAll('.tab-btn')[1].classList.add('active');
        document.getElementById('view-list').style.display = 'none';
        document.getElementById('view-calendar').style.display = 'block';
      }
    }

    function openEditModal(id) {
      const item = window.chores.find(c => c.id === id);
      if (!item) return;
      document.getElementById('edit-id').value = item.id;
      document.getElementById('edit-title').value = item.title;
      document.getElementById('edit-executor').value = item.executor;
      document.getElementById('edit-date').value = item.date;
      document.getElementById('edit-repeat-type').value = item.repeatType || (item.isRecurring ? 'daily' : 'none');
      document.getElementById('edit-interval-days').value = item.intervalDays || 3;
      
      toggleEditIntervalInput();
      document.getElementById('modal-edit').classList.add('open');
    }

    function openManageHistoryModal() {
      const tContainer = document.getElementById('manage-titles-list');
      const eContainer = document.getElementById('manage-executors-list');

      tContainer.innerHTML = window.historyTitles.map((t, idx) => `
        <div class="manage-item">
          <input type="text" value="${t}">
          <button class="icon-btn" onclick="this.parentElement.remove()" style="color:red;">刪除</button>
        </div>
      `).join('');

      eContainer.innerHTML = window.historyExecutors.map((e, idx) => `
        <div class="manage-item">
          <input type="text" value="${e}">
          <button class="icon-btn" onclick="this.parentElement.remove()" style="color:red;">刪除</button>
        </div>
      `).join('');

      document.getElementById('modal-manage-history').classList.add('open');
    }

    function addManageItem(type) {
      const container = document.getElementById(type === 'title' ? 'manage-titles-list' : 'manage-executors-list');
      const div = document.createElement('div');
      div.className = 'manage-item';
      div.innerHTML = `
        <input type="text" placeholder="請輸入新名稱">
        <button class="icon-btn" onclick="this.parentElement.remove()" style="color:red;">刪除</button>
      `;
      container.appendChild(div);
    }

    function closeModal(id) { document.getElementById(id).classList.remove('open'); }
  </script>
</body>
</html>
